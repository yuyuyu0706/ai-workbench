name: PromptTrail Agent Step

on:
  workflow_dispatch:
    inputs:
      step:
        description: Step to run
        type: choice
        options:
          - dummy
        required: true
        default: dummy
      issueNumber:
        description: Target issue number
        type: string
        required: false
      promptTrailRunId:
        description: Caller-provided run id
        type: string
        required: true
      forceFailure:
        description: Force this run to fail
        type: choice
        options:
          - 'false'
          - 'true'
        required: true
        default: 'false'

permissions:
  contents: read

concurrency:
  group: agent-step-${{ github.event.inputs.promptTrailRunId }}
  cancel-in-progress: false

jobs:
  run:
    name: Run agent step
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record inputs
        run: |
          echo "step: ${{ inputs.step }}"
          echo "issueNumber: ${{ inputs.issueNumber }}"
          echo "promptTrailRunId: ${{ inputs.promptTrailRunId }}"
          echo "forceFailure: ${{ inputs.forceFailure }}"

      - name: Generate dummy output
        run: |
          cat <<EOF > output.md
          # Agent step (dummy)

          - step: ${{ inputs.step }}
          - issueNumber: ${{ inputs.issueNumber }}
          - promptTrailRunId: ${{ inputs.promptTrailRunId }}
          - forceFailure: ${{ inputs.forceFailure }}
          - workflow run: ${{ github.run_id }}

          This is a dummy output generated by the P3-5 Lv3-2 execution foundation.
          EOF

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ inputs.promptTrailRunId }}
          path: output.md
          if-no-files-found: error
          retention-days: 7

      - name: Append job summary
        run: cat output.md >> "$GITHUB_STEP_SUMMARY"

      - name: Force failure
        if: inputs.forceFailure == 'true'
        run: exit 1
