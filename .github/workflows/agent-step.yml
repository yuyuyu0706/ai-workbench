name: PromptTrail Agent Step

on:
  workflow_dispatch:
    inputs:
      step:
        description: Step to run
        type: choice
        options:
          - dummy
        required: true
        default: dummy
      issueNumber:
        description: Target issue number
        type: string
        required: false
      promptTrailRunId:
        description: Caller-provided run id
        type: string
        required: true
      forceFailure:
        description: Force this run to fail
        type: choice
        options:
          - 'false'
          - 'true'
        required: true
        default: 'false'

permissions:
  contents: read

concurrency:
  group: agent-step-${{ github.event.inputs.promptTrailRunId }}
  cancel-in-progress: false

jobs:
  run:
    name: Run agent step
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate promptTrailRunId
        env:
          PROMPT_TRAIL_RUN_ID: ${{ inputs.promptTrailRunId }}
        run: |
          if ! [[ "$PROMPT_TRAIL_RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::promptTrailRunId contains characters unsafe for an artifact name: $PROMPT_TRAIL_RUN_ID"
            exit 1
          fi

      - name: Record inputs
        env:
          STEP: ${{ inputs.step }}
          ISSUE_NUMBER: ${{ inputs.issueNumber }}
          PROMPT_TRAIL_RUN_ID: ${{ inputs.promptTrailRunId }}
          FORCE_FAILURE: ${{ inputs.forceFailure }}
        run: |
          echo "step: $STEP"
          echo "issueNumber: $ISSUE_NUMBER"
          echo "promptTrailRunId: $PROMPT_TRAIL_RUN_ID"
          echo "forceFailure: $FORCE_FAILURE"

      - name: Generate dummy output
        env:
          STEP: ${{ inputs.step }}
          ISSUE_NUMBER: ${{ inputs.issueNumber }}
          PROMPT_TRAIL_RUN_ID: ${{ inputs.promptTrailRunId }}
          FORCE_FAILURE: ${{ inputs.forceFailure }}
        run: |
          cat <<EOF > output.md
          # Agent step (dummy)

          - step: $STEP
          - issueNumber: $ISSUE_NUMBER
          - promptTrailRunId: $PROMPT_TRAIL_RUN_ID
          - forceFailure: $FORCE_FAILURE
          - workflow run: ${{ github.run_id }}

          This is a dummy output generated by the P3-5 Lv3-2 execution foundation.
          EOF

      - name: Upload artifact
        if: always() && hashFiles('output.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-output-${{ inputs.promptTrailRunId }}
          path: output.md
          if-no-files-found: error
          retention-days: 7

      - name: Append job summary
        run: cat output.md >> "$GITHUB_STEP_SUMMARY"

      - name: Force failure
        if: inputs.forceFailure == 'true'
        run: exit 1
