name: Temporary Issue 179 Format Artifact

on:
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.1'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier apps/prompt-trail/src/developer-data --write
      - uses: actions/upload-artifact@v4
        with:
          name: issue-179-prettier-output
          path: apps/prompt-trail/src/developer-data
          if-no-files-found: error
