name: PromptTrail Public Alpha Feedback
description: PromptTrail Public Alphaを利用した感想や問題を共有する
title: '[PromptTrail Public Alpha Feedback] '
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Feedbackありがとうございます。GitHub Issueは公開されます。Prompt、Run、Linkなどのアプリ内データ、個人情報、機密情報、API Key、Tokenは記載しないでください。
  - type: dropdown
    id: feedback-type
    attributes:
      label: Feedbackの種類
      options:
        - 困ったこと・不具合
        - 分かりにくかったこと
        - 良かったこと
        - 機能の提案
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: 体験したこと
      description: 機密情報を除き、行った操作と期待した結果を教えてください。
      placeholder: Dashboardから新しいTrailを作ろうとしたときに…
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 利用環境（任意）
      description: OS、browser、画面サイズなど、共有可能な範囲で記載してください。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: アプリ内データ、個人情報、機密情報、API Key、Tokenを記載していません。
          required: true
