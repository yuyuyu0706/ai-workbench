<h2 class="sr-only">
  Trail・TrailStep・Prompt・Run・Linkの関係性を示すDomainモデル図。新規・変更箇所と既存を区別する。
</h2>
<div id="erd"></div>
<script type="module">
  import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  await document.fonts.ready;
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    fontFamily: '"anthropic-sans", sans-serif',
    themeVariables: {
      darkMode: dark,
      fontSize: '13px',
      fontFamily: '"anthropic-sans", sans-serif',
      lineColor: dark ? '#9c9a92' : '#73726c',
      textColor: dark ? '#c2c0b6' : '#3d3d3a',
      primaryColor: dark ? '#444441' : '#F1EFE8',
      primaryBorderColor: dark ? '#B4B2A9' : '#5F5E5A',
      primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
    },
  });
  const src = `erDiagram
    PROJECT ||--o{ TRAIL : "束ねる（実装済み）"
    TRAIL ||--o{ TRAIL_STEP : "束ねる・順序を持つ（新規）"
    TRAIL_STEP ||--o{ RUN : "実行する（新規・間接参照を置き換え）"
    TRAIL_STEP }o--o| PROMPT : "参照する。0または1（新規）"
    RUN ||--o{ LINK : "外部成果物を保持（実装済み）"

    PROJECT {
        string title
        string repositoryUrl
    }
    TRAIL {
        string title
        string kind
    }
    TRAIL_STEP {
        number order
        string kind
        string title
        string promptId FK "nullable"
        string note "nullable"
    }
    PROMPT {
        string title
        string body
        string tags
    }
    RUN {
        string trailStepId FK
        string promptSnapshot
        string output
        string status
    }
    LINK {
        string runId FK
        string type
        string role
    }`;
  const { svg } = await mermaid.render('erd-svg', src);
  document.getElementById('erd').innerHTML = svg;

  document.querySelectorAll('#erd .er.entityBox').forEach((box) => {
    box.setAttribute('rx', '6');
    box.setAttribute('ry', '6');
  });
  document
    .querySelectorAll('#erd .er.attributeBoxOdd, #erd .er.attributeBoxEven')
    .forEach((row) => {
      row.setAttribute('stroke', 'none');
    });

  // 新規・変更箇所（TRAIL_STEPを含む関係・エンティティ）を既存と色で区別する。
  const newFill = dark ? '#2E4F3B' : '#EAF3EC';
  const newStroke = dark ? '#8FCB9F' : '#2E7D4F';
  document.querySelectorAll('#erd .er.entityLabel').forEach((label) => {
    if (label.textContent && label.textContent.includes('TRAIL_STEP')) {
      const box = label.closest('g')?.querySelector('.er.entityBox');
      if (box) {
        box.setAttribute('fill', newFill);
        box.setAttribute('stroke', newStroke);
      }
    }
  });
  document
    .querySelectorAll('#erd .relationshipLabel, #erd .relationshipLabelBox')
    .forEach((el) => {
      if (el.textContent && el.textContent.includes('新規')) {
        el.setAttribute('fill', newStroke);
      }
    });
</script>
